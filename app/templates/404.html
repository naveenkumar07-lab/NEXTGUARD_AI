{% extends "base.html" %}

{% block title %}404 — Endpoint Not Found — NetGuard AI{% endblock %}

{% block content %}
<div class="soc-card text-center py-5">
    <div class="display-1 fw-bold text-info font-monospace mb-2">404</div>
    <h2 class="h4 text-white mb-2">Endpoint or Resource Not Found</h2>
    <p class="text-muted small mb-4">The requested URI does not exist or has been relocated within the SOC routing table.</p>
    <div>
        <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-soc-primary">
            <i class="bi bi-arrow-left"></i> Return to SOC Dashboard
        </a>
    </div>
</div>
{% endblock %}
